# NickLabs Orbis native: if systemd-oomd runs (needs PSI, enabled in the GE kernel), it kills the
# model server first when its slice stalls on memory, before the whole console thrashes.
# MemoryHigh=92% from 0.2.0 still applies. Enable with: systemctl enable --now systemd-oomd
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
