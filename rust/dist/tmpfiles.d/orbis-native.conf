# NickLabs Orbis native components
# orbis-run markers: any user may create one; orbis-perf only trusts a marker owned by the
# same user as the process it names (sticky bit stops users deleting each other's)
d /run/orbis/games 1777 root root -
d /run/orbis/perf  0755 root root -
# pre-launch admission requests (GE-A03): any user may ask; orbis-perf checks the file owner
d /run/orbis/admit 1777 root root -
d /var/lib/orbis/time  0755 root root -
d /var/lib/orbis/perf  0755 root root -
d /var/lib/orbis/games 0755 root root -
